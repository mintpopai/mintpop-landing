<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 兜底页不参与收录：meta / X-Robots-Tag 响应头 / robots.txt 三重声明 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 品牌图统一引用 standards.mintpop.ai，仓库内不留副本 -->
    <link
      rel="icon"
      type="image/png"
      href="https://standards.mintpop.ai/assets/brand/app-icon/mintpop-app-cloud.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://standards.mintpop.ai/assets/brand/app-icon/mintpop-app-cloud.png"
    />
    <!-- title/lang 由 useHead 动态接管；此处保留英文文案作无 JS 兜底 -->
    <title>Nothing here · MintPop</title>
    <meta
      name="description"
      content="This address isn't home to any MintPop product — it may have moved, or the URL may be mistyped."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
